name: Native M8 energy and housing

on:
  push:
    branches:
      - refactor/cpp-m3-v33
      - refactor/cpp-m4-v33
      - refactor/cpp-m5-v33
      - refactor/cpp-m6-v33
      - refactor/cpp-m7-v33
      - refactor/cpp-m8-v33
      - refactor/cpp-engine-v33
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "macro_sim/**/*.py"
      - "native/**"
      - "pyproject.toml"
      - "schemas/m0/**"
      - "schemas/m1/**"
      - "schemas/m2/**"
      - "schemas/m3/**"
      - "schemas/m4/**"
      - "schemas/m5/**"
      - "schemas/m6/**"
      - "schemas/m7/**"
      - "schemas/m8/**"
      - "tests/native/**"
      - "tools/m1/**"
      - "tools/m2/**"
      - "tools/m3/**"
      - "tools/m4/**"
      - "tools/m5/**"
      - "tools/m6/**"
      - "tools/m7/**"
      - "tools/m8/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / C++20 / wheel
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Unix build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: choco install ccache ninja --no-progress -y
      - name: Resolve locked environment
        run: uv sync --group dev --group m1
      - name: Verify M8 contracts and current playable target
        run: uv run python tools/m8/check.py --skip-build
      - name: Configure native release
        run: uv run cmake --preset m8-release
      - name: Build native release
        run: uv run cmake --build --preset m8-release --parallel 8
      - name: Test native release
        run: uv run ctest --preset m8-release -j 8
      - name: Verify installed C package
        run: >-
          uv run python tools/m1/installed_c_smoke.py
          --build-dir build/native/m8-release
          --prefix build/install/m8-ci
      - name: Verify M5 monetary performance budget
        run: >-
          uv run python tools/m5/performance_gate.py
          --budget schemas/m5/performance_budget.json
          --build-dir build/native/m8-release
      - name: Verify M6 securities performance budget
        run: >-
          uv run python tools/m6/performance_gate.py
          --budget schemas/m6/performance_budget.json
          --build-dir build/native/m8-release
      - name: Verify M7 population and labor performance budget
        run: >-
          uv run python tools/m7/performance_gate.py
          --budget schemas/m7/performance_budget.json
          --build-dir build/native/m8-release
      - name: Verify M8 energy and housing performance budget
        run: >-
          uv run python tools/m8/performance_gate.py
          --budget schemas/m8/performance_budget.json
          --build-dir build/native/m8-release
      - name: Build wheel and source distribution
        run: |
          uv build --wheel
          uv build --sdist
      - name: Verify isolated wheel
        run: uv run python tools/m8/wheel_smoke.py --wheel-dir dist
      - name: Verify source artifact offline inputs
        run: uv run python tools/m8/source_artifact_smoke.py --sdist-dir dist
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/*
            schemas/m1/hashes.lock.json
            schemas/m1/native_sbom.spdx.json
            schemas/m2/performance_budget.json
            schemas/m3/performance_budget.json
            schemas/m4/current_engine_target.json
            schemas/m4/performance_budget.json
            schemas/m4/reference_performance.json
            schemas/m4/stochastic_envelopes.json
            schemas/m5/performance_budget.json
            schemas/m6/performance_budget.json
            schemas/m7/performance_budget.json
            schemas/m8/performance_budget.json
          if-no-files-found: error

  sanitizers:
    name: ${{ matrix.os }} / ASan and UBSan
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Resolve locked environment
        run: uv sync --group dev --group m1
      - name: Configure sanitizer build
        run: uv run cmake --preset m8-asan
      - name: Build sanitizer targets
        run: uv run cmake --build --preset m8-asan --parallel 8
      - name: Run sanitizer tests
        run: uv run ctest --preset m8-asan -j 8
