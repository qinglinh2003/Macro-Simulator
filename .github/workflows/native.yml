name: Native M11 Product

on:
  push:
    branches:
      - refactor/cpp-m3-v33
      - refactor/cpp-m4-v33
      - refactor/cpp-m5-v33
      - refactor/cpp-m6-v33
      - refactor/cpp-m7-v33
      - refactor/cpp-m8-v33
      - refactor/cpp-m9-v33
      - refactor/cpp-m10-v34
      - refactor/cpp-m11-v34
      - refactor/cpp-engine-v33
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "macro_sim/**/*.py"
      - "native/**"
      - "desktop/godot/**"
      - "pyproject.toml"
      - "scripts/package_m11_linux.sh"
      - "scripts/package_m11_macos.sh"
      - "scripts/package_m11_windows.ps1"
      - "schemas/m0/**"
      - "schemas/m1/**"
      - "schemas/m2/**"
      - "schemas/m3/**"
      - "schemas/m4/**"
      - "schemas/m5/**"
      - "schemas/m6/**"
      - "schemas/m7/**"
      - "schemas/m8/**"
      - "schemas/m9/**"
      - "schemas/m10/**"
      - "schemas/m11/**"
      - "tests/native/**"
      - "tools/m1/**"
      - "tools/m2/**"
      - "tools/m3/**"
      - "tools/m4/**"
      - "tools/m5/**"
      - "tools/m6/**"
      - "tools/m7/**"
      - "tools/m8/**"
      - "tools/m9/**"
      - "tools/m10/**"
      - "tools/m11/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.platform }} / C++20 / wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-13
            platform: macos-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Unix build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache ninja --no-progress -y
          $root = if ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } else {
            "C:\vcpkg"
          }
          & "$root\vcpkg.exe" install zlib:x64-windows --clean-after-build
          $toolchain = "$root\scripts\buildsystems\vcpkg.cmake"
          "CMAKE_TOOLCHAIN_FILE=$toolchain" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve locked environment
        run: >-
          uv sync --no-install-project --extra rl --extra visualization
          --group dev --group m1 --group m11
      - name: Verify contracts and current playable target
        run: uv run python tools/m11/check.py --skip-build
      - name: Configure native release
        run: uv run cmake --preset m11-release
      - name: Build native release
        run: uv run cmake --build --preset m11-release --parallel 8
      - name: Test native release
        run: uv run ctest --preset m11-release -j 8
      - name: Verify installed C package
        run: >-
          uv run python tools/m1/installed_c_smoke.py
          --build-dir build/native/m11-release
          --prefix build/install/m11-ci
      - name: Verify M5 monetary performance budget
        run: >-
          uv run python tools/m5/performance_gate.py
          --budget schemas/m5/performance_budget.json
          --build-dir build/native/m11-release
      - name: Verify M6 securities performance budget
        run: >-
          uv run python tools/m6/performance_gate.py
          --budget schemas/m6/performance_budget.json
          --build-dir build/native/m11-release
      - name: Verify M7 population and labor performance budget
        run: >-
          uv run python tools/m7/performance_gate.py
          --budget schemas/m7/performance_budget.json
          --build-dir build/native/m11-release
      - name: Verify M8 energy and housing performance budget
        run: >-
          uv run python tools/m8/performance_gate.py
          --budget schemas/m8/performance_budget.json
          --build-dir build/native/m11-release
      - name: Verify M9 World performance budget
        run: >-
          uv run python tools/m9/performance_gate.py
          --budget schemas/m9/performance_budget.json
          --build-dir build/native/m11-release
      - name: Verify M11 desktop performance budget
        if: runner.os != 'Windows'
        run: >-
          uv run python tools/m11/p3_desktop_gate.py
          --server build/native/m11-release/native/macro_sim_server
          --budget schemas/m10/performance_budget.json
      - name: Build wheel and source distribution
        run: |
          uv run cibuildwheel --output-dir dist
          uv build --sdist
      - name: Verify isolated wheel on CPython 3.12
        run: >-
          uv run python tools/m11/wheel_smoke.py
          --wheel-dir dist --python 3.12
      - name: Verify the same abi3 wheel on CPython 3.14
        run: >-
          uv run python tools/m11/wheel_smoke.py
          --wheel-dir dist --python 3.14
      - name: Verify source artifact offline inputs
        run: uv run python tools/m11/source_artifact_smoke.py --sdist-dir dist
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            dist/*
            schemas/m1/hashes.lock.json
            schemas/m1/native_sbom.spdx.json
            schemas/m2/performance_budget.json
            schemas/m3/performance_budget.json
            schemas/m4/current_engine_target.json
            schemas/m4/performance_budget.json
            schemas/m4/reference_performance.json
            schemas/m4/stochastic_envelopes.json
            schemas/m5/performance_budget.json
            schemas/m6/performance_budget.json
            schemas/m7/performance_budget.json
            schemas/m8/performance_budget.json
            schemas/m9/performance_budget.json
          if-no-files-found: error

  sanitizers:
    name: ${{ matrix.os }} / ASan and UBSan
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Resolve locked environment
        run: uv sync --no-install-project --group dev --group m1
      - name: Configure sanitizer build
        run: uv run cmake --preset m11-asan
      - name: Build sanitizer targets
        run: uv run cmake --build --preset m11-asan --parallel 8
      - name: Run sanitizer tests
        run: uv run ctest --preset m11-asan -j 8
      - name: Run parser fuzz corpus under sanitizers
        run: >-
          uv run ctest --preset m11-asan -j 8
          --label-regex fuzz

  static-analysis:
    name: Ubuntu / format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install build and analysis tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ccache clang-format clang-tidy ninja-build
      - name: Resolve locked environment
        run: uv sync --no-install-project --group dev --group m1
      - name: Configure analysis build
        run: uv run cmake --preset m11-debug
      - name: Build analysis targets
        run: uv run cmake --build --preset m11-debug --parallel 8
      - name: Run format and clang-tidy gates
        run: >-
          uv run python tools/m11/static_analysis.py
          --build-dir build/native/m11-debug

  thread-sanitizer:
    name: Ubuntu / TSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: Resolve locked environment
        run: uv sync --no-install-project --group dev --group m1
      - name: Configure TSan build
        run: uv run cmake --preset m11-tsan
      - name: Build TSan targets
        run: uv run cmake --build --preset m11-tsan --parallel 8
      - name: Run TSan tests
        run: uv run ctest --preset m11-tsan -j 8

  coverage:
    name: Ubuntu / native coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install build and coverage tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y ccache ninja-build lcov
      - name: Resolve locked environment
        run: >-
          uv sync --no-install-project --extra rl --extra visualization
          --group dev --group m1
      - name: Configure coverage build
        run: uv run cmake --preset m11-coverage
      - name: Build coverage targets
        run: uv run cmake --build --preset m11-coverage --parallel 8
      - name: Run coverage tests
        run: uv run ctest --preset m11-coverage -j 8
      - name: Capture first-party coverage
        run: |
          lcov --capture \
            --directory build/native/m11-coverage \
            --output-file build/native/m11-coverage/coverage.info \
            --ignore-errors mismatch
          lcov --remove \
            build/native/m11-coverage/coverage.info \
            '/usr/*' '*/native/vendor/*' '*/build/*' \
            --output-file build/native/m11-coverage/coverage.info \
            --ignore-errors unused
          lcov --summary build/native/m11-coverage/coverage.info
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: build/native/m11-coverage/coverage.info
          if-no-files-found: error

  desktop-package:
    name: ${{ matrix.platform }} / packaged Godot
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            architecture: arm64
            package: build/package/Macro Command.app
            archive: build/package/Macro Command-macos-arm64.zip*
          - os: macos-13
            platform: macos-x86_64
            architecture: x86_64
            package: build/package/Macro Command.app
            archive: build/package/Macro Command-macos-x86_64.zip*
          - os: ubuntu-24.04
            platform: linux-x86_64
            architecture: x86_64
            package: build/package/linux/Macro Command
            archive: build/package/linux/MacroCommand-linux-x86_64.tar.gz*
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            architecture: aarch64
            package: build/package/linux/Macro Command
            archive: build/package/linux/MacroCommand-linux-aarch64.tar.gz*
          - os: windows-2022
            platform: windows-x86_64
            architecture: x86_64
            package: build/package/windows/Macro Command
            archive: build/package/windows/MacroCommand-windows-x86_64.zip*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Install build tools
        if: runner.os == 'macOS'
        run: brew install ccache ninja
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache ninja --no-progress -y
          $root = if ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } else {
            "C:\vcpkg"
          }
          & "$root\vcpkg.exe" install zlib:x64-windows --clean-after-build
          $toolchain = "$root\scripts\buildsystems\vcpkg.cmake"
          "CMAKE_TOOLCHAIN_FILE=$toolchain" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve locked environment
        run: uv sync --no-install-project --group dev --group m1
      - name: Build macOS development package
        if: runner.os == 'macOS'
        run: scripts/package_m11_macos.sh
        env:
          MACRO_SIM_PACKAGE_ARCH: ${{ matrix.architecture }}
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: scripts/package_m11_linux.sh
        env:
          MACRO_SIM_PACKAGE_ARCH: ${{ matrix.architecture }}
      - name: Build Windows development package
        if: runner.os == 'Windows'
        run: pwsh -File scripts/package_m11_windows.ps1
      - name: Verify packaged native product
        run: >-
          uv run python tools/m11/packaged_godot_e2e.py
          --package "${{ matrix.package }}"
          --platform "${{ matrix.platform }}"
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: macro-command-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
