[project]
name = "macro-simulator"
version = "0.11.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
rl = [
    "cloudpickle>=3.1.2",
    "gymnasium>=1.3.0",
]
train = [
    "cloudpickle>=3.1.2",
    "gymnasium>=1.3.0",
    "torch>=2.7.0",
]
visualization = [
    "matplotlib>=3.11.0",
]

[project.scripts]
macro-demographics-phase0 = "macro_sim.demographics.phase0:main"
macro-demographics-phase1-acceptance = "macro_sim.demographics.phase1_acceptance:main"
macro-viz-compare = "macro_sim.visualization.compare_versions:main"
macro-viz-run = "macro_sim.visualization.compare_versions:main_single"
macro-diagnostics = "macro_sim.diagnostics.cli:main"
macro-empirical-diagnostics = "macro_sim.diagnostics.empirical_cli:main"
macro-rl = "macro_sim.rl.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
m1 = [
    "flatbuffers==25.2.10",
    "nanobind>=2.9.2,<3",
    "scikit-build-core>=0.11.6,<0.12",
]
m11 = [
    "cibuildwheel==3.4.1",
]

[build-system]
requires = [
    "nanobind>=2.9.2,<3",
    "scikit-build-core>=0.11.6,<0.12",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = "build/wheel/{wheel_tag}"
cmake.build-type = "Release"
cmake.source-dir = "."
sdist.include = [
    "/CMakeLists.txt",
    "/CMakePresets.json",
    "/desktop/godot/**",
    "/native/**",
    "/scripts/package_m11_linux.sh",
    "/scripts/package_m11_macos.sh",
    "/scripts/package_m11_windows.ps1",
    "/schemas/m0/**",
    "/schemas/m1/**",
    "/schemas/m2/**",
    "/schemas/m3/**",
    "/schemas/m4/**",
    "/schemas/m5/**",
    "/schemas/m6/**",
    "/schemas/m7/**",
    "/schemas/m8/**",
    "/schemas/m9/**",
    "/schemas/m10/**",
    "/schemas/m11/**",
    "/tools/m1/**",
    "/tools/m2/**",
    "/tools/m3/**",
    "/tools/m4/**",
    "/tools/m5/**",
    "/tools/m6/**",
    "/tools/m7/**",
    "/tools/m8/**",
    "/tools/m9/**",
    "/tools/m10/**",
    "/tools/m11/**",
]
sdist.exclude = [
    "/.venv/**",
    "/artifacts/**",
    "/build/**",
    "/dist/**",
    "/outputs/**",
    "/runs/**",
]
wheel.packages = ["macro_sim"]
wheel.py-api = "cp312"

[tool.scikit-build.cmake.define]
MACRO_SIM_BUILD_BENCHMARKS = "OFF"
MACRO_SIM_BUILD_PYTHON = "ON"
MACRO_SIM_BUILD_TESTS = "OFF"

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux*"
build-frontend = "uv"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = { VCPKG_TARGET_TRIPLET = "x64-windows-static" }
