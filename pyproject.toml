[project]
name = "macro-simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
macro-demographics-phase0 = "macro_sim.demographics.phase0:main"
macro-demographics-phase1-acceptance = "macro_sim.demographics.phase1_acceptance:main"
macro-viz-compare = "macro_sim.visualization.compare_versions:main"
macro-viz-run = "macro_sim.visualization.compare_versions:main_single"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macro_sim"]
