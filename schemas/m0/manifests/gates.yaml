schema_version: m0-gate-manifest-v1
oracle_commit: c0adcf1f8ea7f69cad28b92e27c9a4509dfdac23
gates:
  - id: framework.tests
    class: pr
    command:
      - uv
      - run
      - pytest
      - -q
      - tests/migration/m0/test_canonical_artifacts.py
      - tests/migration/m0/test_gate_manifest.py
      - tests/migration/m0/test_rebaseline_guard.py
    cwd: .
    dependencies: []
    timeout_seconds: 120
    owner: migration
    artifacts: []
    fixture_ids: []
    platform_profiles:
      - any
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: inventory.check
    class: pr
    command:
      - uv
      - run
      - python
      - scripts/cpp_migration/generate_inventory.py
      - --check
    cwd: .
    dependencies:
      - framework.tests
    timeout_seconds: 120
    owner: migration
    artifacts:
      - schemas/m0/hashes.lock.json
    fixture_ids: []
    platform_profiles:
      - any
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: inventory.tests
    class: pr
    command:
      - uv
      - run
      - pytest
      - -q
      - tests/test_policy_inventory.py
      - tests/test_policy_registry.py
      - tests/test_external_policy.py
      - tests/test_shocks_v27.py
      - tests/test_controller_specs_hardening.py
      - tests/test_controller_observation.py
      - tests/test_desktop_new_game.py
      - tests/migration/m0/test_inventory_generation.py
      - tests/migration/m0/test_inventory_contracts.py
      - tests/migration/m0/test_module_disposition.py
      - tests/migration/m0/test_probe_disposition.py
    cwd: .
    dependencies:
      - inventory.check
    timeout_seconds: 300
    owner: migration
    artifacts: []
    fixture_ids: []
    platform_profiles:
      - any
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: trace.tests
    class: pr
    command:
      - uv
      - run
      - pytest
      - -q
      - tests/test_conservation.py
      - tests/test_world_container.py
      - tests/test_controller_phase_replay_hardening.py
      - tests/migration/m0/test_phase_registry.py
      - tests/migration/m0/test_phase_trace.py
      - tests/migration/m0/test_trace_is_passive.py
      - tests/migration/m0/test_rng_inventory.py
    cwd: .
    dependencies:
      - inventory.tests
    timeout_seconds: 300
    owner: migration
    artifacts: []
    fixture_ids:
      - scenario.config.versions-v124-yaml
    platform_profiles:
      - any
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds:
      - 0
    threshold_ref: null
  - id: trace.repeatability
    class: nightly
    command:
      - uv
      - run
      - python
      - scripts/cpp_migration/export_phase_trace.py
      - --fixture
      - refactor_v124
      - --repeat
      - "3"
      - --require-byte-identical
    cwd: .
    dependencies:
      - trace.tests
    timeout_seconds: 300
    owner: migration
    artifacts: []
    fixture_ids:
      - scenario.config.versions-v124-yaml
    platform_profiles:
      - any
    process_count: 3
    thread_count: 1
    repetitions: 3
    seeds:
      - 0
    threshold_ref: null
