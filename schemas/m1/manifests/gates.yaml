    class: nightly
    command: [uv, run, python, tools/m1/package_gate.py]
    cwd: .
    dependencies: [native.release]
    timeout_seconds: 1200
    owner: native
    artifacts:
      - schemas/m1/native_sbom.spdx.json
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: oracle.m0-audit
    class: milestone
    command:
      - uv
      - run
      - python
      - scripts/cpp_migration/final_audit.py
      - --require-clean
