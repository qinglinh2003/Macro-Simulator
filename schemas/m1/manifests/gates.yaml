schema_version: m0-gate-manifest-v1
oracle_commit: 38e7e5b37b8ae55fdd0c5f9180f0390b258e6597
gates:
  - id: framework.bootstrap
    class: pr
    command: [uv, run, python, tools/m1/bootstrap.py, --check]
    cwd: .
    dependencies: []
    timeout_seconds: 120
    owner: native
    artifacts: []
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: contracts.generated
    class: pr
    command: [uv, run, python, tools/m1/check.py, --skip-build]
    cwd: .
    dependencies: [framework.bootstrap]
    timeout_seconds: 300
    owner: native
    artifacts:
      - schemas/m1/hashes.lock.json
      - schemas/m1/native_sbom.spdx.json
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: native.debug
    class: pr
    command: [uv, run, python, tools/m1/check.py, --preset, m1-debug]
    cwd: .
    dependencies: [contracts.generated]
    timeout_seconds: 600
    owner: native
    artifacts: []
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: oracle.m0-inventory
    class: pr
    command:
      - uv
      - run
      - python
      - scripts/cpp_migration/generate_inventory.py
      - --check
    cwd: .
    dependencies: [contracts.generated]
    timeout_seconds: 180
    owner: migration
    artifacts: [schemas/m0/hashes.lock.json]
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: native.release
    class: nightly
    command: [uv, run, python, tools/m1/check.py, --preset, m1-release]
    cwd: .
    dependencies: [native.debug, oracle.m0-inventory]
    timeout_seconds: 600
    owner: native
    artifacts: []
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: native.sanitizers
    class: nightly
    command: [uv, run, python, tools/m1/check.py, --preset, m1-asan]
    cwd: .
    dependencies: [native.debug]
    timeout_seconds: 900
    owner: native
    artifacts: []
    fixture_ids: []
    platform_profiles: [unix]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
