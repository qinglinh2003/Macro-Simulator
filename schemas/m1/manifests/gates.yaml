    class: nightly
    command:
      - uv
      - run
      - python
      - tools/m1/checkpoint_prototype.py
      - --benchmark
      - --iterations
      - "1000"
    cwd: .
    dependencies: [contracts.generated]
    timeout_seconds: 180
    owner: native
    artifacts: [schemas/m1/checkpoint_prototype.json]
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 3
    seeds: []
    threshold_ref: null
