    dependencies: [milestone.m1-audit]
    timeout_seconds: 900
    owner: native
    artifacts: [native/dependencies.lock.json]
    fixture_ids: []
    platform_profiles: [networked]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: release.m1-audit
    class: release
