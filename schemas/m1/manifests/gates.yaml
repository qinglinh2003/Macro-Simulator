    dependencies: [oracle.m0-inventory, artifacts.installed]
    timeout_seconds: 300
    owner: migration
    artifacts: []
    fixture_ids: []
    platform_profiles: [any]
    process_count: 1
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
  - id: oracle.full-regression
    class: milestone
    command: [uv, run, pytest, -q, -n, "6"]
    cwd: .
    dependencies: [native.sanitizers, artifacts.installed]
    timeout_seconds: 7200
    owner: migration
    artifacts: []
    fixture_ids: []
    platform_profiles: [any]
    process_count: 6
    thread_count: 1
    repetitions: 1
    seeds: []
    threshold_ref: null
